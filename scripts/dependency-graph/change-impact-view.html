<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Change-Impact Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 20px;
        background: var(--vscode-sideBar-background);
        border-bottom: 1px solid var(--vscode-panel-border);
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-icon {
        font-size: 28px;
      }

      .stats-container {
        display: flex;
        gap: 30px;
        margin-top: 15px;
        flex-wrap: wrap;
      }

      .stat-box {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .stat-label {
        font-size: 12px;
        opacity: 0.7;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 600;
      }

      .stat-value.warning {
        color: #f59e0b;
      }

      .stat-value.success {
        color: #10b981;
      }

      .stat-value.info {
        color: #3b82f6;
      }

      .main-content {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .graph-container {
        flex: 1;
        position: relative;
        background: var(--vscode-editor-background);
      }

      #cy {
        width: 100%;
        height: 100%;
      }

      .sidebar {
        width: 350px;
        background: var(--vscode-sideBar-background);
        border-left: 1px solid var(--vscode-panel-border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar-header {
        padding: 15px 20px;
        border-bottom: 1px solid var(--vscode-panel-border);
        font-weight: 600;
        font-size: 14px;
      }

      .sidebar-content {
        flex: 1;
        overflow-y: auto;
        padding: 15px 20px;
      }

      .impact-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .impact-item {
        padding: 12px;
        background: var(--vscode-editor-background);
        border-radius: 6px;
        border: 1px solid var(--vscode-panel-border);
        cursor: pointer;
        transition: all 0.2s;
      }

      .impact-item:hover {
        border-color: var(--vscode-focusBorder);
        background: var(--vscode-list-hoverBackground);
      }

      .impact-item-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .impact-icon {
        font-size: 18px;
      }

      .impact-file {
        font-size: 13px;
        font-weight: 500;
        flex: 1;
        word-break: break-all;
      }

      .impact-symbols {
        font-size: 11px;
        opacity: 0.7;
        margin-left: 26px;
        padding: 6px 8px;
        background: var(--vscode-sideBar-background);
        border-radius: 4px;
      }

      .symbol-tag {
        display: inline-block;
        padding: 2px 6px;
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border-radius: 3px;
        margin-right: 4px;
        margin-bottom: 4px;
        font-size: 10px;
      }

      .legend {
        padding: 15px 20px;
        border-top: 1px solid var(--vscode-panel-border);
        font-size: 12px;
      }

      .legend-title {
        font-weight: 600;
        margin-bottom: 10px;
        opacity: 0.9;
      }

      .legend-items {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .legend-color {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }

      .legend-label {
        opacity: 0.8;
      }

      .controls {
        padding: 15px 20px;
        background: var(--vscode-sideBar-background);
        border-bottom: 1px solid var(--vscode-panel-border);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 6px 12px;
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        transition: background 0.2s;
      }

      .btn:hover {
        background: var(--vscode-button-hoverBackground);
      }

      .btn-secondary {
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
      }

      .btn-secondary:hover {
        background: var(--vscode-button-secondaryHoverBackground);
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        text-align: center;
        opacity: 0.6;
      }

      .empty-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }

      .empty-message {
        font-size: 14px;
      }

      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 16px;
        opacity: 0.7;
      }

      .tooltip {
        position: absolute;
        background: var(--vscode-editorHoverWidget-background);
        border: 1px solid var(--vscode-editorHoverWidget-border);
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 12px;
        pointer-events: none;
        z-index: 1000;
        max-width: 300px;
        word-wrap: break-word;
      }

    </style>
  </head>

  <body>
    <div class="header">
      <h1>
        <span class="header-icon">🔍</span>
        Change-Impact Analysis
      </h1>
      <div class="stats-container">
        <div class="stat-box">
          <div class="stat-label">PR Files</div>
          <div class="stat-value info"
               id="prFilesCount">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Nodes</div>
          <div class="stat-value"
               id="totalNodesCount">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Hidden Impacts</div>
          <div class="stat-value warning"
               id="hiddenImpactsCount">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Edges</div>
          <div class="stat-value"
               id="edgesCount">0</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn"
              id="fitBtn">Fit Graph</button>
      <button class="btn btn-secondary"
              id="resetZoomBtn">Reset Zoom</button>
      <button class="btn btn-secondary"
              id="exportBtn">Export PNG</button>
      <button class="btn btn-secondary"
              id="refreshBtn">Refresh Analysis</button>
    </div>

    <div class="main-content">
      <div class="graph-container">
        <div id="cy"></div>
      </div>

      <div class="sidebar">
        <div class="sidebar-header">
          ⚠️ Hidden Impacts (<span id="hiddenCount">0</span>)
        </div>
        <div class="sidebar-content"
             id="hiddenImpactsList">
          <div class="empty-state">
            <div class="empty-icon">✅</div>
            <div class="empty-message">No hidden impacts found.<br>All affected files are in the PR.</div>
          </div>
        </div>
        <div class="legend">
          <div class="legend-title">Legend</div>
          <div class="legend-items">
            <div class="legend-item">
              <div class="legend-color"
                   style="background: #3b82f6;"></div>
              <div class="legend-label">PR Files</div>
            </div>
            <div class="legend-item">
              <div class="legend-color"
                   style="background: #f59e0b;"></div>
              <div class="legend-label">Hidden Impacts</div>
            </div>
            <div class="legend-item">
              <div class="legend-color"
                   style="background: #6b7280;"></div>
              <div class="legend-label">Internal Edge</div>
            </div>
            <div class="legend-item">
              <div class="legend-color"
                   style="background: #ef4444;"></div>
              <div class="legend-label">Impact Edge</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Initialize Cytoscape
      let cy;
      let graphData = null;

      function initGraph(data) {
        graphData = data;

        // Update stats
        document.getElementById('prFilesCount').textContent = data.metadata.prFiles.length;
        document.getElementById('totalNodesCount').textContent = data.nodes.length;
        document.getElementById('hiddenImpactsCount').textContent = data.metadata.hiddenImpacts.length;
        document.getElementById('edgesCount').textContent = data.edges.length;

        // Update hidden impacts list
        updateHiddenImpactsList(data);

        // Build Cytoscape elements
        const elements = [];

        // Add nodes
        data.nodes.forEach(node => {
          elements.push({
            data: {
              id: node.id,
              label: node.label,
              type: node.type,
              path: node.path,
              changedSymbols: node.changedSymbols || [],
              impactedBy: node.impactedBy || []
            }
          });
        });

        // Add edges
        data.edges.forEach((edge, index) => {
          elements.push({
            data: {
              id: `edge-${index}`,
              source: edge.source,
              target: edge.target,
              label: edge.label,
              type: edge.type
            }
          });
        });

        // Initialize Cytoscape
        cy = cytoscape({
          container: document.getElementById('cy'),
          elements: elements,
          style: [
            {
              selector: 'node',
              style: {
                'label': 'data(label)',
                'text-valign': 'center',
                'text-halign': 'center',
                'text-wrap': 'wrap',
                'text-max-width': '100px',
                'font-size': '11px',
                'width': '60px',
                'height': '60px',
                'background-color': '#3b82f6',
                'color': '#ffffff',
                'border-width': 2,
                'border-color': '#2563eb'
              }
            },
            {
              selector: 'node[type="hidden-impact"]',
              style: {
                'background-color': '#f59e0b',
                'border-color': '#d97706',
                'border-width': 3
              }
            },
            {
              selector: 'edge',
              style: {
                'width': 2,
                'line-color': '#6b7280',
                'target-arrow-color': '#6b7280',
                'target-arrow-shape': 'triangle',
                'curve-style': 'bezier',
                'label': 'data(label)',
                'font-size': '9px',
                'text-rotation': 'autorotate',
                'text-margin-y': -10,
                'color': '#9ca3af'
              }
            },
            {
              selector: 'edge[type="hidden-impact"]',
              style: {
                'line-color': '#ef4444',
                'target-arrow-color': '#ef4444',
                'width': 3,
                'line-style': 'dashed'
              }
            },
            {
              selector: 'node:selected',
              style: {
                'border-color': '#10b981',
                'border-width': 4
              }
            }
          ],
          layout: {
            name: 'cose',
            animate: true,
            animationDuration: 500,
            idealEdgeLength: 100,
            nodeOverlap: 20,
            refresh: 20,
            fit: true,
            padding: 30,
            randomize: false,
            componentSpacing: 100,
            nodeRepulsion: 400000,
            edgeElasticity: 100,
            nestingFactor: 5,
            gravity: 80,
            numIter: 1000,
            initialTemp: 200,
            coolingFactor: 0.95,
            minTemp: 1.0
          }
        });

        // Add tooltips
        cy.on('mouseover', 'node', function (evt) {
          const node = evt.target;
          const data = node.data();

          let tooltip = `<strong>${data.label}</strong><br>`;
          tooltip += `Type: ${data.type}<br>`;
          tooltip += `Path: ${data.path}<br>`;

          if (data.changedSymbols && data.changedSymbols.length > 0) {
            tooltip += `<br>Changed Symbols:<br>`;
            data.changedSymbols.slice(0, 5).forEach(sym => {
              tooltip += `• ${sym.name} (${sym.kind})<br>`;
            });
          }

          if (data.impactedBy && data.impactedBy.length > 0) {
            tooltip += `<br>Impacted By:<br>`;
            tooltip += data.impactedBy.slice(0, 5).join(', ');
          }

          showTooltip(tooltip, evt.renderedPosition);
        });

        cy.on('mouseout', 'node', function () {
          hideTooltip();
        });

        // Node click handler
        cy.on('tap', 'node', function (evt) {
          const node = evt.target;
          const data = node.data();

          // Send message to VS Code to open file
          if (window.vscode) {
            vscode.postMessage({
              command: 'openFile',
              path: data.path
            });
          }
        });
      }

      function updateHiddenImpactsList(data) {
        const listContainer = document.getElementById('hiddenImpactsList');
        const hiddenCount = document.getElementById('hiddenCount');

        hiddenCount.textContent = data.metadata.hiddenImpacts.length;

        if (data.metadata.hiddenImpacts.length === 0) {
          listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">✅</div>
                        <div class="empty-message">No hidden impacts found.<br>All affected files are in the PR.</div>
                    </div>
                `;
          return;
        }

        let html = '<div class="impact-list">';

        data.metadata.hiddenImpacts.forEach(filePath => {
          const node = data.nodes.find(n => n.path === filePath);
          const fileName = filePath.split('/').pop();
          const impactedBy = node?.impactedBy || [];

          html += `
                    <div class="impact-item" onclick="focusNode('${filePath}')">
                        <div class="impact-item-header">
                            <span class="impact-icon">⚠️</span>
                            <div class="impact-file">${fileName}</div>
                        </div>
                        <div class="impact-symbols">
                            <strong>Impacted by:</strong><br>
                            ${impactedBy.map(s => `<span class="symbol-tag">${s}</span>`).join('')}
                        </div>
                    </div>
                `;
        });

        html += '</div>';
        listContainer.innerHTML = html;
      }

      function focusNode(nodeId) {
        if (!cy) return;

        const node = cy.getElementById(nodeId);
        if (node.length > 0) {
          cy.animate({
            center: { eles: node },
            zoom: 1.5
          }, {
            duration: 500
          });

          // Flash the node
          node.flashClass('selected', 1000);
        }
      }

      // Tooltip functions
      let tooltipEl = null;

      function showTooltip(content, position) {
        if (!tooltipEl) {
          tooltipEl = document.createElement('div');
          tooltipEl.className = 'tooltip';
          document.body.appendChild(tooltipEl);
        }

        tooltipEl.innerHTML = content;
        tooltipEl.style.display = 'block';
        tooltipEl.style.left = position.x + 10 + 'px';
        tooltipEl.style.top = position.y + 10 + 'px';
      }

      function hideTooltip() {
        if (tooltipEl) {
          tooltipEl.style.display = 'none';
        }
      }

      // Button handlers
      document.getElementById('fitBtn').addEventListener('click', () => {
        if (cy) cy.fit();
      });

      document.getElementById('resetZoomBtn').addEventListener('click', () => {
        if (cy) cy.zoom(1);
      });

      document.getElementById('exportBtn').addEventListener('click', () => {
        if (cy) {
          const png64 = cy.png({ scale: 2 });
          const link = document.createElement('a');
          link.href = png64;
          link.download = 'change-impact-graph.png';
          link.click();
        }
      });

      document.getElementById('refreshBtn').addEventListener('click', () => {
        if (window.vscode) {
          vscode.postMessage({ command: 'refresh' });
        }
      });

      // Listen for messages from VS Code
      window.addEventListener('message', event => {
        const message = event.data;

        switch (message.command) {
          case 'updateGraph':
            initGraph(message.data);
            break;
        }
      });

      // Request initial data
      if (window.vscode) {
        vscode.postMessage({ command: 'ready' });
      }
    </script>
  </body>

</html>
